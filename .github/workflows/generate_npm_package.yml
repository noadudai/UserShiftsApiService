name: Build C# API

on: push

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0'

      - name: Build ASP.NET Core project
        run: |
          cd backend-csharp/UserShiftsApiService/
          dotnet build
